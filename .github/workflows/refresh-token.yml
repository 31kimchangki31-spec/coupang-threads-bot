name: Threads 토큰 자동 갱신

# 60일 만료를 피하기 위해 넉넉하게 매월 갱신
on:
  schedule:
    - cron: "0 3 1 * *"   # 매월 1일 새벽 3시(UTC)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 갱신 요청
        id: refresh
        run: |
          RESPONSE=$(curl -s -G "https://graph.threads.net/v1.0/refresh_access_token" \
            --data-urlencode "grant_type=th_refresh_token" \
            --data-urlencode "access_token=${{ secrets.THREADS_ACCESS_TOKEN }}")

          NEW_TOKEN=$(echo "$RESPONSE" | python3 -c \
            "import sys, json; print(json.load(sys.stdin).get('access_token',''))")

          if [ -z "$NEW_TOKEN" ]; then
            echo "토큰 갱신 실패. 응답에 access_token이 없습니다."
            exit 1
          fi

          # 로그에 토큰이 남지 않도록 마스킹
          echo "::add-mask::$NEW_TOKEN"
          echo "new_token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"
          echo "토큰 갱신 성공"

      - name: GitHub Secret 업데이트
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set THREADS_ACCESS_TOKEN \
            --body "${{ steps.refresh.outputs.new_token }}" \
            --repo ${{ github.repository }}
