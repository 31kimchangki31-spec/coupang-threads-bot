name: Coupang -> Threads 자동 게시

on:
  # GitHub 내부 스케줄(schedule)은 신뢰성이 낮아 제거함.
  # 대신 cron-job.org가 이 workflow_dispatch를 API로 직접 호출해서 트리거함.
  workflow_dispatch: {}

permissions:
  contents: write   # posted.json 커밋을 위해 필요

jobs:
  post:
    runs-on: self-hosted
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 버전 확인 (PC에 미리 설치된 파이썬 사용)
        shell: bash
        run: python --version

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: python -m playwright install chromium
  
      - name: 랜덤 대기 (1~5분)
        shell: bash
        run: |
          DELAY=$((RANDOM % 240 + 60))
          echo "이번 실행은 ${DELAY}초(약 $((DELAY/60))분) 대기 후 게시합니다."
          sleep $DELAY
      - name: 자동 게시 실행
        shell: bash
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py

      - name: 게시 기록 커밋
        shell: bash
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: 게시 기록 업데이트"
          git push
