name: Coupang -> Threads 자동 게시

on:
  schedule:
    # 한국시간(KST) 오전 9시 / 오후 1시 / 오후 8시 = UTC 00:05 / 04:05 / 11:05
    # 분을 5로 잡아 GitHub 정각 혼잡 시간대를 피함
    - cron: "5 0,4,11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 결과만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coupang-threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 랜덤 대기 (1~5분)
        run: |
          DELAY=$((RANDOM % 240 + 60))
          echo "${DELAY}초 대기 후 게시합니다."
          sleep $DELAY

      - name: 자동 게시 실행
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: python main.py

      - name: 카드 이미지 업로드 (디버그용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composed-card
          path: composed_card.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 게시 기록 커밋
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: 게시 기록 업데이트"
          git push
