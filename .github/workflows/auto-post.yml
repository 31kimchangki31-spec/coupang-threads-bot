name: Coupang -> Threads 자동 게시

on:
  schedule:
    # 한국시간(KST) 오전 9시 / 오후 1시 / 오후 8시 = UTC 00:05 / 04:05 / 11:05
    # 분을 5로 잡아 GitHub 정각 혼잡 시간대를 피함
    - cron: "5 0,4,11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 결과만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coupang-threads-post
  cancel-in-progress: false

jobs:
  post:
    # 쿠팡이 데이터센터 IP를 Akamai 단계에서 차단하므로 가정용 IP가 필요하다.
    # 공용 러너로 돌리려면 ubuntu-latest 로 바꾸고 BROWSER_PROXY 를 설정할 것.
    runs-on: self-hosted
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 카드 이미지를 커밋/푸시해서 호스팅하므로 자격증명이 유지되어야 한다
          persist-credentials: true

      - name: 파이썬 확인
        run: python3 --version

      - name: 패키지 설치
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          # --with-deps 는 sudo 가 필요해 self-hosted 에서 실패할 수 있다.
          # 브라우저 본체만 설치하고, 실패해도 이미 설치돼 있으면 계속 진행한다.
          python3 -m playwright install chromium || true

      - name: 이전 실행 잔재 정리
        run: |
          rm -rf cards post_image.jpg debug_goldbox.png
        continue-on-error: true

      - name: 랜덤 대기 (1~5분)
        run: |
          DELAY=$((RANDOM % 240 + 60))
          echo "${DELAY}초 대기 후 게시합니다."
          sleep $DELAY

      - name: 자동 게시 실행
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TOPIC_TAG: ${{ vars.POST_TOPIC_TAG || '광고' }}
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: python3 main.py

      - name: 카드 이미지 업로드 (디버그용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-images
          path: |
            post_image.jpg
            debug_goldbox.png
            cards/
          if-no-files-found: ignore
          retention-days: 3

      - name: 게시 기록 커밋
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: 게시 기록 업데이트"
          git push origin HEAD:${GITHUB_REF_NAME}
