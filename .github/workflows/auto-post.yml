name: Coupang -> Threads 자동 게시

on:
  schedule:
    # KST 07:05 ~ 23:35 사이 30분 간격(매시 5분, 35분)
    #
    # KST = UTC+9 이므로 KST 07~23시는 UTC 22~14시에 해당한다.
    # (KST 07시 = UTC 22시, KST 23시 = UTC 14시)
    # 심야(KST 00~06시)는 게시하지 않는다. 하루 34회.
    - cron: "5,35 0-14,22-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 결과만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coupang-threads-post
  cancel-in-progress: false

jobs:
  post:
    # 쿠팡이 데이터센터 IP를 Akamai 단계에서 차단하므로 가정용 IP가 필요하다.
    # 공용 러너로 돌리려면 ubuntu-latest 로 바꾸고 BROWSER_PROXY 를 설정할 것.
    runs-on: self-hosted

    defaults:
      run:
        # 윈도우 러너의 기본 셸은 PowerShell 이라 '||', 'rm -rf' 등이 동작하지 않는다.
        # Git for Windows 에 포함된 bash 를 쓰면 OS와 무관하게 같은 스크립트가 돌아간다.
        shell: bash
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 카드 이미지를 커밋/푸시해서 호스팅하므로 자격증명이 유지되어야 한다
          persist-credentials: true

      - name: 게시 여부 결정
        id: gate
        run: |
          # 하루 34개 슬롯 중 목표 횟수만큼만 확률적으로 실행한다.
          # 이렇게 하면 "매 30분마다 정확히" 라는 패턴이 사라지고
          # 게시 간격이 30분~2시간 사이로 불규칙해진다.
          TARGET=${TARGET_POSTS_PER_DAY:-24}
          SLOTS=34

          # 수동 실행(workflow_dispatch)은 건너뛰지 않는다
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "수동 실행 - 건너뛰기 없음"
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEEP=$(( TARGET * 100 / SLOTS ))
          if [ -n "${RANDOM:-}" ]; then
            ROLL=$(( RANDOM % 100 ))
          else
            ROLL=$(awk 'BEGIN{srand();print int(rand()*100)}')
          fi

          if [ "$ROLL" -lt "$KEEP" ]; then
            echo "실행 (roll=${ROLL} < ${KEEP}, 목표 ${TARGET}회/일)"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "이번 슬롯은 건너뜁니다 (roll=${ROLL} >= ${KEEP})"
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
        env:
          TARGET_POSTS_PER_DAY: ${{ vars.TARGET_POSTS_PER_DAY || '24' }}

      - name: 파이썬 확인
        id: py
        if: steps.gate.outputs.run == 'yes'
        run: |
          # 윈도우는 python, 리눅스/맥은 python3 인 경우가 많다
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            PY=python
          fi
          echo "cmd=$PY" >> "$GITHUB_OUTPUT"
          $PY --version

      - name: 패키지 설치
        if: steps.gate.outputs.run == 'yes'
        run: |
          PY="${{ steps.py.outputs.cmd }}"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements.txt
          # 이미 설치돼 있으면 실패해도 그대로 진행한다.
          # (--with-deps 는 sudo 가 필요해 self-hosted 에서 쓰지 않는다)
          $PY -m playwright install chromium || true

      - name: 이전 실행 잔재 정리
        if: steps.gate.outputs.run == 'yes'
        run: |
          # .browser-profile 은 쿠키 유지를 위해 지우지 않는다
          rm -rf cards post_image.jpg debug_goldbox.png
        continue-on-error: true

      - name: 랜덤 대기
        if: steps.gate.outputs.run == 'yes'
        run: |
          # 슬롯 안에서도 게시 시각을 넓게 흩뿌린다.
          # 0~900초(최대 15분)면 :05 슬롯이 :05~:20 사이 어디든 된다.
          MAX=${DELAY_MAX_SECONDS:-900}
          if [ -n "${RANDOM:-}" ]; then
            DELAY=$(( RANDOM % (MAX + 1) ))
          else
            # bash 가 아닌 셸로 실행된 경우 대비 (RANDOM 미지원)
            DELAY=$(awk -v m="$MAX" 'BEGIN{srand();print int(rand()*(m+1))}')
          fi
          echo "${DELAY}초 대기 후 게시합니다. (최대 ${MAX}초)"
          sleep "$DELAY"
        env:
          DELAY_MAX_SECONDS: ${{ vars.DELAY_MAX_SECONDS || '900' }}

      - name: 자동 게시 실행
        if: steps.gate.outputs.run == 'yes'
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TOPIC_TAG: ${{ vars.POST_TOPIC_TAG || '광고' }}
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
          # Akamai 우회 관련. 기본값은 실제 크롬 + headed + 프로필 유지.
          # 게시 기록 초기화 시각(KST). 게시 스케줄이 07:05~05:35 이라 06시가 경계.
          RESET_HOUR: ${{ vars.RESET_HOUR || '6' }}
          KEEP_CARD_IMAGES: ${{ vars.KEEP_CARD_IMAGES || '30' }}
          BROWSER_CHANNEL: ${{ vars.BROWSER_CHANNEL || 'chrome' }}
          HEADLESS: ${{ vars.HEADLESS || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: ${{ steps.py.outputs.cmd }} main.py

      - name: 카드 이미지 업로드 (디버그용)
        if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: card-images
          path: |
            post_image.jpg
            debug_goldbox.png
            cards/
          if-no-files-found: ignore
          retention-days: 3

      - name: 게시 기록 커밋
        if: success() && steps.gate.outputs.run == 'yes' && inputs.dry_run != true
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore: 게시 기록 업데이트"

          # 러너가 체크아웃한 뒤 원격이 갱신되면 push 가 거부된다.
          # 원격 변경을 rebase 로 당겨와 최대 3회까지 재시도한다.
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "게시 기록 푸시 완료"
              exit 0
            fi
            echo "push 거부 (${i}/3), 원격 변경을 가져와 재시도"
            git fetch origin "$BRANCH"
            git pull --rebase --autostash origin "$BRANCH" || {
              git rebase --abort || true
              echo "rebase 실패"
              exit 1
            }
            sleep 3
          done
          echo "게시 기록 푸시 실패 - 다음 실행에서 중복 게시될 수 있습니다"
          exit 1
