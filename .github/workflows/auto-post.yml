name: Coupang -> Threads 자동 게시

on:
  schedule:
    - cron: "5 22-23,0-20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install --with-deps chromium

      - name: Playwright 설치 확인
        run: |
          echo "설치된 브라우저 목록:"
          ls -la ~/.cache/ms-playwright/ || echo "캐시 폴더가 없습니다 (설치 실패)"
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(channel='chromium'); print('브라우저 정상 실행 확인'); b.close(); p.stop()"

      - name: 랜덤 대기 (5~10분)
        run: |
          DELAY=$((RANDOM % 300 + 300))
          echo "이번 실행은 ${DELAY}초(약 $((DELAY/60))분) 대기 후 게시합니다."
          sleep $DELAY

      - name: 자동 게시 실행
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python main.py

      - name: 디버그 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug_full_page.png
            goldbox_item.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 게시 기록 커밋
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: 게시 기록 업데이트"
          git push
