name: Coupang -> Threads 자동 게시

on:
  schedule:
    # GitHub Actions는 UTC 기준
    #
    # 한국시간(KST)
    # 07:00 ~ 23:30
    # 00:00 ~ 05:30
    #
    # 즉, KST 기준 07:00부터 다음날 05:30까지
    # 30분마다 실행
    - cron: "7,37 22-23,0-20 * * *"

  workflow_dispatch: {}

# 같은 workflow가 겹쳐서 동시에 게시되는 것을 방지
concurrency:
  group: coupang-threads-auto-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 자동 게시 실행
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python main.py

      - name: 게시 기록 커밋
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"

          git add posted.json posted_slots.json

          if git diff --cached --quiet; then
            echo "커밋할 변경사항이 없습니다."
          else
            git commit -m "chore: 게시 기록 업데이트"
            git push
          fi
