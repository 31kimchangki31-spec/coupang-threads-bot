name: Toss -> Threads 자동 게시

on:
  schedule:
    - cron: "5,35 22-23,0-14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: self-hosted
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 버전 확인
        shell: bash
        run: python --version

      - name: 파이썬 패키지 설치
        shell: bash
        run: pip install -r requirements.txt

      - name: 자동 게시 실행
        shell: bash
        env:
          TOSS_ACCESS_KEY: ${{ secrets.TOSS_ACCESS_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TOSS_PUBLISHER_ID: ${{ secrets.TOSS_PUBLISHER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py

      - name: 합성 이미지 업로드(디버그용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composed-card
          path: composed_card.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 게시 기록 커밋
        shell: bash
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: 게시 기록 업데이트"
          git push
