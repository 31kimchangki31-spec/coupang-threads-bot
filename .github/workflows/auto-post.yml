name: Coupang -> Threads 자동 게시

on:
  schedule:
    # KST 07:05 ~ 05:35 사이 30분 간격(매시 5분, 35분)
    #
    # KST = UTC+9 이므로 KST 07~05시는 UTC 22~20시에 해당한다.
    # 제외되는 시간은 UTC 21시(= KST 06시) 한 시간뿐이라
    # UTC 0-20 과 22-23 을 지정한다. 하루 46회.
    - cron: "5,35 0-20,22-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 결과만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coupang-threads-post
  cancel-in-progress: false

jobs:
  post:
    # 쿠팡이 데이터센터 IP를 Akamai 단계에서 차단하므로 가정용 IP가 필요하다.
    # 공용 러너로 돌리려면 ubuntu-latest 로 바꾸고 BROWSER_PROXY 를 설정할 것.
    runs-on: self-hosted

    defaults:
      run:
        # 윈도우 러너의 기본 셸은 PowerShell 이라 '||', 'rm -rf' 등이 동작하지 않는다.
        # Git for Windows 에 포함된 bash 를 쓰면 OS와 무관하게 같은 스크립트가 돌아간다.
        shell: bash
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 카드 이미지를 커밋/푸시해서 호스팅하므로 자격증명이 유지되어야 한다
          persist-credentials: true

      - name: 파이썬 확인
        id: py
        run: |
          # 윈도우는 python, 리눅스/맥은 python3 인 경우가 많다
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            PY=python
          fi
          echo "cmd=$PY" >> "$GITHUB_OUTPUT"
          $PY --version

      - name: 패키지 설치
        run: |
          PY="${{ steps.py.outputs.cmd }}"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements.txt
          # 이미 설치돼 있으면 실패해도 그대로 진행한다.
          # (--with-deps 는 sudo 가 필요해 self-hosted 에서 쓰지 않는다)
          $PY -m playwright install chromium || true

      - name: 이전 실행 잔재 정리
        run: |
          # .browser-profile 은 쿠키 유지를 위해 지우지 않는다
          rm -rf cards post_image.jpg debug_goldbox.png
        continue-on-error: true

      - name: 랜덤 대기
        run: |
          # 매번 정확히 :05, :35 에 올라가면 기계적인 패턴이 드러난다.
          # 0~200초 사이로 흔들어 게시 시각을 분산시킨다.
          MAX=${DELAY_MAX_SECONDS:-200}
          if [ -n "${RANDOM:-}" ]; then
            DELAY=$(( RANDOM % (MAX + 1) ))
          else
            # bash 가 아닌 셸로 실행된 경우 대비 (RANDOM 미지원)
            DELAY=$(awk -v m="$MAX" 'BEGIN{srand();print int(rand()*(m+1))}')
          fi
          echo "${DELAY}초 대기 후 게시합니다. (최대 ${MAX}초)"
          sleep "$DELAY"
        env:
          DELAY_MAX_SECONDS: ${{ vars.DELAY_MAX_SECONDS || '200' }}

      - name: 자동 게시 실행
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TOPIC_TAG: ${{ vars.POST_TOPIC_TAG || '광고' }}
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
          # Akamai 우회 관련. 기본값은 실제 크롬 + headed + 프로필 유지.
          # 게시 기록 초기화 시각(KST). 게시 스케줄이 07:05~05:35 이라 06시가 경계.
          RESET_HOUR: ${{ vars.RESET_HOUR || '6' }}
          BROWSER_CHANNEL: ${{ vars.BROWSER_CHANNEL || 'chrome' }}
          HEADLESS: ${{ vars.HEADLESS || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: ${{ steps.py.outputs.cmd }} main.py

      - name: 카드 이미지 업로드 (디버그용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-images
          path: |
            post_image.jpg
            debug_goldbox.png
            cards/
          if-no-files-found: ignore
          retention-days: 3

      - name: 게시 기록 커밋
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: 게시 기록 업데이트"
          git push origin HEAD:${GITHUB_REF_NAME}
